name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Wrapper & Build Debug APK
        run: |
          # যদি ফাইলগুলো Dolby-Atmos-5-1-main ফোল্ডারের ভেতরে থাকে
          if [ -d "Dolby-Atmos-5-1-main" ]; then
            cd Dolby-Atmos-5-1-main
          fi
          
          # gradlew ফাইল না থাকলে অটো তৈরি করবে
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dolby-By-Shiblu-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
