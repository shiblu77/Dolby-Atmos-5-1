name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        run: |
          if [ -d "Dolby-Atmos-5-1-main" ]; then
            cd Dolby-Atmos-5-1-main
          fi

          # ১. অ্যান্ড্রয়েড SDK লাইসেন্স অটো-অ্যাকসেপ্ট করা
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # ২. AI Studio-র মিসিং debug.keystore তৈরি করা
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # ৩. Gradle 9.3.1 এর সঠিক র্যাপার তৈরি করা
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          
          chmod +x gradlew
          
          # ৪. টেস্ট ছাড়া দ্রুত এপিকে বিল্ড করা
          ./gradlew assembleDebug -x test --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dolby-By-Shiblu-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
